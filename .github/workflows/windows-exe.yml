name: Publish self-contained Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/**'
      - '.github/workflows/windows-exe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

# Pull-request artifacts use the PR head SHA, not the temporary merge ref.
env:
  OSRS_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: osrslive-windows-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify release version and diagnostic version agree
        shell: pwsh
        run: |
          $declared = ([xml](Get-Content native/OSRSLiveDiagnostics.csproj -Raw)).Project.PropertyGroup.Version
          $source = Get-Content native/Diagnostics.cs -Raw
          $match = [regex]::Match($source, 'internal const string Version="([^"]+)";')
          if (-not $match.Success -or $match.Groups[1].Value -ne $declared) {
            throw "Diagnostic version does not match project release version $declared"
          }
      - name: Build
        shell: pwsh
        run: dotnet build native/OSRSLiveDiagnostics.csproj -c Release -r win-x64 --nologo -p:OsrsBuildRun=$env:GITHUB_RUN_ID -p:OsrsBuildSha=$env:OSRS_BUILD_SHA -p:OsrsBuildChannel=$env:GITHUB_EVENT_NAME
      - name: Verify embedded build identity
        shell: pwsh
        run: |
          $stamp = dotnet run --project native/OSRSLiveDiagnostics.csproj -c Release --no-build -- --build-info
          Write-Host $stamp
          if ($LASTEXITCODE -ne 0 -or $stamp -notmatch "build_run=$env:GITHUB_RUN_ID" -or
              $stamp -notmatch "build_commit=$env:OSRS_BUILD_SHA" -or
              $stamp -notmatch "build_channel=$env:GITHUB_EVENT_NAME") {
            throw "EXE build metadata does not identify the running CI job"
          }
      - name: Self-test
        shell: pwsh
        run: |
          dotnet run --project native/OSRSLiveDiagnostics.csproj -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed: $LASTEXITCODE" }
      - name: OCR fixture test (Windows language availability reported separately)
        shell: pwsh
        run: |
          dotnet run --project native/OSRSLiveDiagnostics.csproj -c Release --no-build -- --ocr-self-test
          if ($LASTEXITCODE -eq 2) { Write-Warning 'OCR fixture not run: no Windows OCR language on runner'; exit 0 }
          if ($LASTEXITCODE -ne 0) { throw 'Windows OCR fixture failed' }
      - name: Verify automatic map localisation and public collision routes
        shell: pwsh
        run: |
          dotnet run --project native/OSRSLiveDiagnostics.csproj -c Release --no-build -- --navigation-self-test
          if ($LASTEXITCODE -ne 0) { throw 'Automatic navigation/reference-data test failed' }
      - name: Verify fixed viewport and docked log
        shell: pwsh
        run: |
          $test = Start-Process -FilePath 'native/bin/Release/net10.0-windows10.0.19041.0/win-x64/OSRS-Play.exe' -ArgumentList '--layout-self-test' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput layout-test.log -RedirectStandardError layout-test.err
          Get-Content layout-test.log
          Get-Content layout-test.err
          if ($test.ExitCode -ne 0) { throw "Layout test failed: $($test.ExitCode)" }
      - name: Verify background capture and input transport
        shell: pwsh
        run: |
          $test = Start-Process -FilePath 'native/bin/Release/net10.0-windows10.0.19041.0/win-x64/OSRS-Play.exe' -ArgumentList '--background-self-test' -WindowStyle Hidden -Wait -PassThru -RedirectStandardOutput background-test.log -RedirectStandardError background-test.err
          Get-Content background-test.log
          Get-Content background-test.err
          if ($test.ExitCode -eq 2) { Write-Warning 'Windows Graphics Capture unavailable on this runner; real background operation not validated here'; exit 0 }
          if ($test.ExitCode -ne 0) { throw "Background transport test failed: $($test.ExitCode)" }
      - name: Publish single self-contained EXE
        shell: pwsh
        run: |
          dotnet publish native/OSRSLiveDiagnostics.csproj -c Release -r win-x64 --no-restore -o publish --nologo -p:OsrsBuildRun=$env:GITHUB_RUN_ID -p:OsrsBuildSha=$env:OSRS_BUILD_SHA -p:OsrsBuildChannel=$env:GITHUB_EVENT_NAME
          $exe = 'publish/OSRS-Play.exe'
          if (-not (Test-Path $exe)) { throw 'Missing EXE' }
          $additional = @(Get-ChildItem publish -File | Where-Object Name -NE 'OSRS-Play.exe')
          if ($additional.Count -ne 0) { throw ('Publish is not single-file: ' + ($additional.Name -join ', ')) }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) { throw "EXE unexpectedly small: $size" }
          Write-Host "Single EXE verified: $size bytes"
          Write-Host (Get-FileHash $exe -Algorithm SHA256).Hash
      - name: Upload Windows test EXE for pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OSRS-Play-${{ github.event.pull_request.number }}-run-${{ github.run_id }}-win-x64-test
          path: publish/OSRS-Play.exe
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content native/OSRSLiveDiagnostics.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = "v$version"
          $exe = 'publish/OSRS-Play.exe'
          # Existing v0.5.x auto-updaters require the original asset name.
          $legacy = Join-Path $env:RUNNER_TEMP 'OSRS-Live-Diagnostics.exe'
          Copy-Item $exe $legacy -Force
          if ((Get-FileHash $exe -Algorithm SHA256).Hash -ne (Get-FileHash $legacy -Algorithm SHA256).Hash) {
            throw 'Legacy binary digest differs'
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe $legacy --clobber
          } else {
            gh release create $tag $exe $legacy --title "OSRS Play $tag" --notes "OSRS Play ${tag}: read-only RuneLite companion with complete local session logs, automatic clipboard copy on errors or non-executed actions, and a red improvement-required notice. OCR variants and capture rejection details are recorded without screenshots or credentials. Live plane-0 coordinate OCR is not yet validated; automatic RuneLite gameplay actions remain unavailable. The previous C++ backend requires --legacy-official. See docs/LOGGING-1.8.2.md and docs/HANDOFF-RUNELITE-2026-10-27.md."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @("version=$version", "exeUrl=https://github.com/Riflex91/osrslive/releases/download/$tag/OSRS-Live-Diagnostics.exe", "exeSha256=$hash") | Set-Content -Encoding utf8 update-exe.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-exe.properties
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish EXE updater manifest $tag [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
