name: Publish self-contained Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/**'
      - '.github/workflows/windows-exe.yml'
  pull_request:
    branches: [main]
    paths:
      - 'native/**'
      - 'docs/**'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: osrslive-windows-exe-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        shell: pwsh
        run: dotnet build native/OSRSLiveDiagnostics.csproj -c Release -r win-x64 --nologo
      - name: Self-test
        shell: pwsh
        run: |
          dotnet run --project native/OSRSLiveDiagnostics.csproj -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw "Self-test failed: $LASTEXITCODE" }
      - name: Mining/GE scenario suite
        shell: pwsh
        run: |
          dotnet run --project native/OSRSLiveDiagnostics.csproj -c Release --no-build -- --scenario-tests
          if ($LASTEXITCODE -ne 0) { throw "Scenario suite failed: $LASTEXITCODE" }
      - name: Publish single self-contained EXE
        shell: pwsh
        run: |
          dotnet publish native/OSRSLiveDiagnostics.csproj -c Release -r win-x64 --no-restore -o publish --nologo
          $exe = 'publish/OSRS-Live-Diagnostics.exe'
          if (-not (Test-Path $exe)) { throw 'Missing EXE' }
          $additional = @(Get-ChildItem publish -File | Where-Object Name -NE 'OSRS-Live-Diagnostics.exe')
          if ($additional.Count -ne 0) { throw ('Publish is not single-file: ' + ($additional.Name -join ', ')) }
          $size = (Get-Item $exe).Length
          if ($size -lt 10000000) { throw "EXE unexpectedly small: $size" }
          Write-Host "Single EXE verified: $size bytes"
          Write-Host (Get-FileHash $exe -Algorithm SHA256).Hash
      - name: Publish verified GitHub release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content native/OSRSLiveDiagnostics.csproj -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version' }
          $tag = "v$version"
          $exe = 'publish/OSRS-Live-Diagnostics.exe'
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "OSRS Live Diagnostics $tag (Single EXE)" --notes "Standalone Windows x64 EXE, no Java and no separate .NET installation. Auto-update on startup. No OSRS game connection."
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          @("version=$version", "exeUrl=https://github.com/Riflex91/osrslive/releases/download/$tag/OSRS-Live-Diagnostics.exe", "exeSha256=$hash") | Set-Content -Encoding utf8 update-exe.properties
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add update-exe.properties
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish EXE updater manifest $tag [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          }
